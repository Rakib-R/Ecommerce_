packages:
  - 'apps/*'
  - '!apps/api-e2e'
  - '!apps/api-gateway-e2e'
  - '!apps/auth-service-e2e'
  - 'apps/utils'
  - 'packages/utils/*'
  - 'packages/libs/*'
  - 'packages/*'
  - '!packages/components'
  - '!packages/libs'
  - '!packages/src'
allowBuilds:
  '@prisma/client': false
  '@scarf/scarf': false
  argon2: false

  # auto-install missing peer deps (default true in pnpm 8+)
autoInstallPeers: true
strictPeerDependencies: false
# resolve peers from anywhere in the workspace, not just the parent
resolve-peers-from-workspace-root: true
